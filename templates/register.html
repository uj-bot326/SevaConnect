<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SevaConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                Seva<span>Connect</span>
            </div>

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Join the SevaConnect community
            </p>


            <form method="POST" action="/register">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <label for="role">
                    Register As
                </label>

                <select id="role" name="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="volunteer">
                        Volunteer
                    </option>

                    <option value="ngo">
                        NGO / Organization
                    </option>

                </select>


                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login here</a>
            </p>

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
