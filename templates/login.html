<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SevaConnect</title>

    <!-- Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        /* ================================
           LOGIN PAGE
        ================================= */

        .login-page {
            margin: 0;
            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #ffffff 50%,
                    #eff6ff
                );

            display: flex;
            flex-direction: column;
        }


        /* ================================
           NAVBAR
        ================================= */

        .login-page .navbar {
            width: 100%;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid #e5e7eb;
        }

        .login-page .logo {
            color: #15803d;
            text-decoration: none;
            font-size: 27px;
            font-weight: 700;
        }


        /* ================================
           MAIN AREA
        ================================= */

        .login-main {
            flex: 1;

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 25px;

            box-sizing: border-box;
        }


        /* ================================
           LOGIN CARD
        ================================= */

        .login-card {
            width: 100%;
            max-width: 520px;

            background: white;

            padding: 45px 50px;

            border-radius: 20px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 20px 55px rgba(15,23,42,0.10);

            box-sizing: border-box;
        }


        /* ================================
           HEADER
        ================================= */

        .login-header {
            text-align: center;

            margin-bottom: 35px;
        }

        .login-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 18px;

            border-radius: 17px;

            background: #dcfce7;

            color: #15803d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .login-header h1 {
            margin: 0 0 10px;

            color: #172554;

            font-size: 31px;

            font-weight: 700;

            line-height: 1.25;
        }

        .login-header p {
            margin: 0;

            color: #64748b;

            font-size: 14px;

            line-height: 1.7;
        }


        /* ================================
           FORM
        ================================= */

        .login-form {
            display: flex;

            flex-direction: column;

            gap: 22px;
        }

        .login-group {
            width: 100%;
        }

        .login-group label {
            display: block;

            margin-bottom: 9px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        /* ================================
           INPUT WRAPPER
        ================================= */

        .login-input-wrapper,
        .login-password-wrapper {
            position: relative;

            width: 100%;
        }


        /* ================================
           LEFT ICON
        ================================= */

        .login-input-wrapper > i,
        .password-left-icon {
            position: absolute;

            left: 17px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 15px;

            pointer-events: none;

            z-index: 2;
        }


        /* ================================
           INPUTS
        ================================= */

        .login-input-wrapper input,
        .login-password-wrapper input {

            width: 100%;

            height: 54px;

            box-sizing: border-box;

            padding-left: 48px;

            padding-right: 18px;

            border: 1px solid #d7dee8;

            border-radius: 11px;

            background: #ffffff;

            color: #1e293b;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        .login-input-wrapper input::placeholder,
        .login-password-wrapper input::placeholder {
            color: #94a3b8;
        }

        .login-input-wrapper input:focus,
        .login-password-wrapper input:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34,197,94,0.12);
        }


        /* ================================
           PASSWORD INPUT
        ================================= */

        .login-password-wrapper input {
            padding-right: 58px;
        }


        /* ================================
           EYE BUTTON
        ================================= */

        .login-password-toggle {

            position: absolute;

            right: 9px;

            top: 50%;

            transform: translateY(-50%);

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            border-radius: 8px;

            color: #64748b;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s ease;
        }

        .login-password-toggle:hover {

            color: #15803d;

            background: #f0fdf4;
        }

        .login-password-toggle:focus {

            outline: none;

            color: #15803d;

            background: #f0fdf4;
        }


        /* ================================
           LOGIN BUTTON
        ================================= */

        .login-button {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background: #15803d;

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition: 0.2s ease;
        }

        .login-button:hover {

            background: #166534;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(22,101,52,0.20);
        }


        /* ================================
           REGISTER LINK
        ================================= */

        .login-register {

            text-align: center;

            margin-top: 27px;
        }

        .login-register p {

            margin: 0;

            color: #64748b;

            font-size: 13px;
        }

        .login-register a {

            color: #15803d;

            font-weight: 600;

            text-decoration: none;
        }

        .login-register a:hover {

            text-decoration: underline;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .login-main {
                padding: 35px 16px;
            }

            .login-card {

                max-width: 100%;

                padding: 35px 25px;
            }

            .login-header h1 {
                font-size: 27px;
            }

            .login-page .logo {
                font-size: 23px;
            }
        }

    </style>
</head>


<body class="login-page">

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{{ url_for('home') }}"
                class="logo"
            >
                SevaConnect
            </a>

            <div class="nav-links">

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </div>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="login-main">

        <div class="login-card">


            <!-- HEADER -->

            <div class="login-header">

                <div class="login-icon">

                    <i class="fa-solid fa-right-to-bracket"></i>

                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue your SevaConnect journey.
                </p>

            </div>


            <!-- ERROR -->

            {% if error %}

            <div class="alert-error">

                <i class="fa-solid fa-circle-exclamation"></i>

                <span>
                    {{ error }}
                </span>

            </div>

            {% endif %}


            <!-- FORM -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
            >


                <!-- EMAIL -->

                <div class="login-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="login-input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="login-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="login-password-wrapper">

                        <i
                            class="fa-solid fa-lock password-left-icon"
                        ></i>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="login-password-toggle"
                            onclick="toggleLoginPassword()"
                            aria-label="Show password"
                        >

                            <i
                                id="login-eye-icon"
                                class="fa-solid fa-eye"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </form>


            <!-- REGISTER -->

            <div class="login-register">

                <p>

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Create an account
                    </a>

                </p>

            </div>


        </div>

    </main>


    <!-- PASSWORD TOGGLE -->

    <script>

        function toggleLoginPassword() {

            const password =
                document.getElementById("login-password");

            const icon =
                document.getElementById("login-eye-icon");

            const button =
                document.querySelector(
                    ".login-password-toggle"
                );


            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    </script>

</body>
</html>
